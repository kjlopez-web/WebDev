<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Survey</title>

<style>
body{
font-family: Arial;
background-color:#f4f4f4;
}

form{
width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

fieldset{
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
}
</style>

</head>

<body>

<h1 style="text-align:center;">Music Survey</h1>

<form>

<label>Name:</label>
<input type="text"><br>

<label>Email:</label>
<input type="email"><br>

<label>Comments:</label>
<textarea cols="60" rows="3"></textarea><br>

<fieldset>
<legend>Favorite Genre</legend>

<input type="radio" name="genre"> Jazz
<input type="radio" name="genre"> Gospel
<input type="radio" name="genre"> Hip-Hop

</fieldset>

<label>Favorite Platform:</label>
<select size="3">
<option>Spotify</option>
<option>Apple Music</option>
<option>YouTube</option>
<option>Pandora</option>
</select><br><br>

<label>Date you listen to music:</label>
<input type="date"><br><br>

<input type="submit">
<input type="reset">

</form>

<footer style="text-align:center; margin-top:20px;">
<p>Kayla Lopez | 22lopezkay@gmail.com</p>
</footer>

</body>
</html>
