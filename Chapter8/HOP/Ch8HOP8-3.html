<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HOP 8.3</title>
</head>

<body>

<h1>Survey Form</h1>

<form>

<p>Favorite Music Style:</p>
<input type="radio" name="music" value="jazz"> Jazz<br>
<input type="radio" name="music" value="gospel"> Gospel<br>
<input type="radio" name="music" value="pop"> Pop<br><br>

<p>Hobbies:</p>
<input type="checkbox" name="hobby" value="music"> Playing Music<br>
<input type="checkbox" name="hobby" value="sports"> Sports<br>
<input type="checkbox" name="hobby" value="reading"> Reading<br><br>

<label for="level">College Level:</label><br>
<select id="level" name="level">
<option>Freshman</option>
<option>Sophomore</option>
<option>Junior</option>
<option>Senior</option>
</select><br><br>

<input type="submit" value="Submit">

</form>

</body>
</html>
